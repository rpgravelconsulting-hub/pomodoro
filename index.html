<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pomodoro Timer</title>
<style>
  :root {
    --work: #e63946;
    --break: #2a9d8f;
    --bg: #1d1f27;
    --card: #262936;
    --text: #f1f1f1;
    --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.4s ease;
  }
  body.break-mode { background: #12211f; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 40px 50px;
    width: 360px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .mode-label {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .mode-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
    background: var(--work);
    color: white;
    transition: background 0.4s ease;
  }
  .mode-badge.break { background: var(--break); }

  .time {
    font-size: 72px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 10px 0 4px;
  }

  .cycle-label {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .progress-ring {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3a3d4a;
    transition: background 0.3s ease;
  }
  .dot.done { background: var(--work); }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }

  #startBtn { background: var(--work); color: white; }
  body.break-mode #startBtn { background: var(--break); }
  #resetBtn { background: #3a3d4a; color: var(--text); }

  button:disabled { opacity: 0.5; cursor: default; }

  .status {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    min-height: 16px;
  }

  .stats {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    min-height: 14px;
  }

  .analytics-login {
    margin-top: 12px;
    display: none;
    gap: 6px;
    justify-content: center;
  }
  .analytics-login input {
    width: 120px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #3a3d4a;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
  }
  .analytics-login button {
    padding: 6px 12px;
    font-size: 12px;
    background: #3a3d4a;
    color: var(--text);
  }
  .analytics-error {
    margin-top: 6px;
    font-size: 11px;
    color: var(--work);
    min-height: 13px;
  }

  .dashboard-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
  }
  .dashboard-link:hover { color: var(--text); }

  .settings-toggle {
    display: block;
    margin: 10px auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .settings-toggle:hover { color: var(--text); }

  .settings-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border, #3a3d4a);
    text-align: left;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .settings-row input {
    width: 60px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #3a3d4a;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    text-align: center;
  }
  .settings-save {
    width: 100%;
    margin-top: 4px;
    background: var(--work);
    color: white;
    padding: 10px;
  }
  body.break-mode .settings-save { background: var(--break); }
  .settings-status {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    min-height: 13px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mode-label">Pomodoro Timer</div>
    <div class="mode-badge" id="modeBadge">Focus</div>
    <div class="time" id="timeDisplay">25:00</div>
    <div class="cycle-label" id="cycleLabel">Round 1 of 4</div>
    <div class="progress-ring" id="progressRing"></div>
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="status" id="status"></div>
    <div class="stats" id="statsLine"></div>
    <div class="analytics-login" id="analyticsLogin">
      <input type="password" id="analyticsPassword" placeholder="Analytics password">
      <button id="analyticsLoginBtn">View</button>
    </div>
    <div class="analytics-error" id="analyticsError"></div>
    <a href="dashboard.html" class="dashboard-link">View full dashboard &rarr;</a>
    <button class="settings-toggle" id="settingsToggle">Settings</button>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-row">
        <span>Focus minutes</span>
        <input type="number" id="workMinutesInput" min="1" max="180">
      </div>
      <div class="settings-row">
        <span>Break minutes</span>
        <input type="number" id="breakMinutesInput" min="1" max="60">
      </div>
      <div class="settings-row">
        <span>Rounds</span>
        <input type="number" id="roundsInput" min="1" max="20">
      </div>
      <button class="settings-save" id="settingsSaveBtn">Save settings</button>
      <div class="settings-status" id="settingsStatus"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  let WORK_MIN = 25;
  let BREAK_MIN = 5;
  let TOTAL_ROUNDS = 4;
  const SUPABASE_URL = 'https://skdvlhsgzxnstcsbmcjc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_psMJz3oXWOGuY5h8TWA3bw_Tt_lFVN8';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const timeDisplay = document.getElementById('timeDisplay');
  const modeBadge = document.getElementById('modeBadge');
  const cycleLabel = document.getElementById('cycleLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const status = document.getElementById('status');
  const statsLine = document.getElementById('statsLine');
  const analyticsLogin = document.getElementById('analyticsLogin');
  const analyticsPassword = document.getElementById('analyticsPassword');
  const analyticsLoginBtn = document.getElementById('analyticsLoginBtn');
  const analyticsError = document.getElementById('analyticsError');
  const progressRing = document.getElementById('progressRing');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const workMinutesInput = document.getElementById('workMinutesInput');
  const breakMinutesInput = document.getElementById('breakMinutesInput');
  const roundsInput = document.getElementById('roundsInput');
  const settingsSaveBtn = document.getElementById('settingsSaveBtn');
  const settingsStatus = document.getElementById('settingsStatus');
  const body = document.body;

  const ANALYTICS_PASSWORD_KEY = 'pomodoro_analytics_password';

  let round = 1;
  let isBreak = false;
  let secondsLeft = WORK_MIN * 60;
  let timerId = null;
  let running = false;

  function createDots() {
    progressRing.innerHTML = '';
    for (let i = 0; i < TOTAL_ROUNDS; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      progressRing.appendChild(dot);
    }
  }
  createDots();

  async function loadSettings() {
    try {
      const { data, error } = await db
        .from('settings')
        .select('work_minutes, break_minutes, rounds')
        .eq('id', 1)
        .single();
      if (error || !data) return;
      WORK_MIN = data.work_minutes;
      BREAK_MIN = data.break_minutes;
      TOTAL_ROUNDS = data.rounds;
      workMinutesInput.value = WORK_MIN;
      breakMinutesInput.value = BREAK_MIN;
      roundsInput.value = TOTAL_ROUNDS;
      createDots();
      reset();
    } catch (e) {
      // supabase unreachable - fall back to local defaults
    }
  }

  async function logSession(type, durationSeconds, roundNumber) {
    try {
      await db.from('sessions').insert({
        type,
        duration_seconds: durationSeconds,
        round: roundNumber,
      });
    } catch (e) {
      // supabase unreachable - skip logging
    }
    refreshStats();
  }

  async function refreshStats() {
    const password = localStorage.getItem(ANALYTICS_PASSWORD_KEY);
    if (!password) {
      showAnalyticsLogin();
      return;
    }
    try {
      const { data: stats, error } = await db.rpc('get_pomodoro_stats', {
        input_password: password,
      });
      if (error) {
        localStorage.removeItem(ANALYTICS_PASSWORD_KEY);
        showAnalyticsLogin('Wrong password');
        return;
      }
      statsLine.textContent =
        `Today: ${stats.today_sessions} sessions, ${stats.today_focus_minutes}m focus · ` +
        `Streak: ${stats.current_streak_days}d`;
      hideAnalyticsLogin();
    } catch (e) {
      // supabase unreachable - leave stats blank
    }
  }

  function showAnalyticsLogin(error) {
    statsLine.textContent = '';
    analyticsLogin.style.display = 'flex';
    analyticsError.textContent = error || '';
  }

  function hideAnalyticsLogin() {
    analyticsLogin.style.display = 'none';
    analyticsError.textContent = '';
  }

  async function submitAnalyticsLogin() {
    const password = analyticsPassword.value;
    if (!password) return;
    try {
      const { data: valid, error } = await db.rpc('verify_analytics_password', {
        input_password: password,
      });
      if (error || !valid) {
        analyticsError.textContent = 'Wrong password';
        return;
      }
      localStorage.setItem(ANALYTICS_PASSWORD_KEY, password);
      analyticsPassword.value = '';
      refreshStats();
    } catch (e) {
      analyticsError.textContent = 'Supabase unreachable';
    }
  }

  analyticsLoginBtn.addEventListener('click', submitAnalyticsLogin);
  analyticsPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAnalyticsLogin();
  });

  settingsToggle.addEventListener('click', () => {
    const showing = settingsPanel.style.display === 'block';
    settingsPanel.style.display = showing ? 'none' : 'block';
  });

  async function saveSettings() {
    const work_minutes = parseInt(workMinutesInput.value, 10);
    const break_minutes = parseInt(breakMinutesInput.value, 10);
    const rounds = parseInt(roundsInput.value, 10);

    if (!work_minutes || work_minutes < 1 || work_minutes > 180 ||
        !break_minutes || break_minutes < 1 || break_minutes > 60 ||
        !rounds || rounds < 1 || rounds > 20) {
      settingsStatus.textContent = 'Check the values (focus 1-180, break 1-60, rounds 1-20)';
      return;
    }

    settingsSaveBtn.disabled = true;
    settingsStatus.textContent = 'Saving...';
    try {
      const { error } = await db
        .from('settings')
        .update({ work_minutes, break_minutes, rounds })
        .eq('id', 1);
      if (error) {
        settingsStatus.textContent = 'Failed to save';
      } else {
        WORK_MIN = work_minutes;
        BREAK_MIN = break_minutes;
        TOTAL_ROUNDS = rounds;
        createDots();
        reset();
        settingsStatus.textContent = 'Saved';
      }
    } catch (e) {
      settingsStatus.textContent = 'Supabase unreachable';
    }
    settingsSaveBtn.disabled = false;
  }

  settingsSaveBtn.addEventListener('click', saveSettings);

  function updateDots() {
    const dots = progressRing.querySelectorAll('.dot');
    dots.forEach((d, i) => d.classList.toggle('done', i < round - 1 || (i === round - 1 && isBreak)));
  }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function render() {
    timeDisplay.textContent = formatTime(secondsLeft);
    modeBadge.textContent = isBreak ? 'Break' : 'Focus';
    modeBadge.classList.toggle('break', isBreak);
    body.classList.toggle('break-mode', isBreak);
    cycleLabel.textContent = `Round ${round} of ${TOTAL_ROUNDS}`;
    updateDots();
    document.title = `${formatTime(secondsLeft)} - ${isBreak ? 'Break' : 'Focus'}`;
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = isBreak ? 660 : 440;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } catch (e) {}
  }

  function tick() {
    secondsLeft--;
    if (secondsLeft < 0) {
      advance();
      return;
    }
    render();
  }

  function advance() {
    beep();
    logSession(isBreak ? 'break' : 'focus', (isBreak ? BREAK_MIN : WORK_MIN) * 60, round);
    if (!isBreak) {
      isBreak = true;
      secondsLeft = BREAK_MIN * 60;
      status.textContent = 'Break time!';
    } else {
      if (round >= TOTAL_ROUNDS) {
        stop();
        status.textContent = 'All 4 rounds complete. Nice work!';
        timeDisplay.textContent = '00:00';
        updateDots();
        return;
      }
      round++;
      isBreak = false;
      secondsLeft = WORK_MIN * 60;
      status.textContent = 'Back to focus!';
    }
    render();
  }

  function start() {
    if (running) return;
    running = true;
    startBtn.textContent = 'Pause';
    status.textContent = '';
    timerId = setInterval(tick, 1000);
  }

  function pause() {
    running = false;
    startBtn.textContent = 'Start';
    clearInterval(timerId);
  }

  function reset() {
    pause();
    round = 1;
    isBreak = false;
    secondsLeft = WORK_MIN * 60;
    status.textContent = '';
    render();
  }

  startBtn.addEventListener('click', () => {
    if (running) pause(); else start();
  });
  resetBtn.addEventListener('click', reset);

  render();
  loadSettings();
  refreshStats();
</script>
</body>
</html>
